name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and compile
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2

      - name: Check formatting and whitespace
        run: |
          zig fmt --check src/*.zig build.zig
          git diff --check

      - name: Run tests
        run: zig build test --summary all

      - name: Compile Panda
        run: zig build check --summary all

      - name: Compile native UI
        run: >-
          xcrun swiftc app/PandaUI.swift app/ConfigStore.swift
          -parse-as-library -swift-version 5 -enable-bare-slash-regex
          -target arm64-apple-macosx13.0
          -framework AppKit -framework SwiftUI -framework ApplicationServices
          -framework ServiceManagement -o "$RUNNER_TEMP/PandaUI"

      - name: Test native UI config editing
        run: scripts/test-ui.sh
